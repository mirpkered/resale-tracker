name: Verify existing Resale Tracker Worker account
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Identify the account already hosting the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN is unavailable to this workflow.');
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function get(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            if (!response.ok) throw new Error(`Cloudflare read failed at ${path.split('?')[0]} (HTTP ${response.status}).`);
            const body = await response.json();
            if (!body.success || !Array.isArray(body.result)) throw new Error(`Cloudflare returned an invalid read response at ${path.split('?')[0]}.`);
            return body.result;
          }
          const accounts = await get('/accounts?per_page=100');
          const found = [];
          for (const account of accounts) {
            const scripts = await get(`/accounts/${encodeURIComponent(account.id)}/workers/scripts?per_page=100`);
            if (scripts.some((script) => (script.id ?? script.name) === 'resale-tracker-private-sync')) found.push(account.id);
          }
          if (found.length !== 1) throw new Error(`Expected exactly one account with the existing Worker; found ${found.length}. No deployment was attempted.`);
          console.log(`Verified existing Worker account ID: ${found[0]}`);
          NODE
